services:
  - type: web
    name: stocks-con-3x
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/auth/status
    envVars:
      - key: STOXX_DATA_DIR
        value: /var/data
    disk:
      name: stocks-con-3x-data
      mountPath: /var/data
      sizeGB: 1
